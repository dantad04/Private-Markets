<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page_title | e }} - Private Market Insider: Australia</title>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      margin: 24px;
      line-height: 1.4;
      color: #111;
    }
    nav {
      margin-bottom: 16px;
    }
    nav a {
      margin-right: 12px;
    }
    .banner,
    .flash,
    .error {
      border: 1px solid #999;
      padding: 10px 12px;
      margin-bottom: 16px;
      background: #f5f5f5;
    }
    .error {
      border-color: #b33;
      background: #fff0f0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 16px;
    }
    th,
    td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      vertical-align: top;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }
    code,
    pre {
      font-family: inherit;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .counts {
      display: flex;
      gap: 24px;
      margin: 16px 0;
    }
    .counts ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }
    .pagination {
      margin: 16px 0;
    }
    .metadata-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 12px;
      margin-bottom: 16px;
    }
    form .field {
      margin-bottom: 12px;
    }
    input[type="text"],
    input[type="date"],
    input[type="number"] {
      width: 100%;
      max-width: 640px;
      padding: 6px 8px;
      box-sizing: border-box;
      font: inherit;
    }
    button {
      padding: 8px 12px;
      font: inherit;
    }
  </style>
</head>
<body>
  <div class="banner">{{ banner_text | e }}</div>
  <nav>
    <a href="{{ request.url_for('source_files_list') | e }}">Source files</a>
    <a href="{{ request.url_for('admin_ui_ingest_form') | e }}">Ingest</a>
  </nav>
  {% if flash %}
  <div class="flash">{{ flash | e }}</div>
  {% endif %}
  {% if error_message %}
  <div class="error">{{ error_message | e }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
